[build]
  publish = "solar-system"
  functions = "netlify/functions"
  # The ONE build step in an otherwise buildless static site — bundles just
  # the React landing page (landing-src/, vite.landing.config.js) into
  # solar-system/landing-dist/. Everything else in solar-system/src/ is
  # still plain ES modules loaded via importmap at runtime, unbundled.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Without this block, `netlify dev` auto-detects "vite" from package.json's
# devDependencies and assumes there's a live Vite DEV SERVER to proxy on a
# port (5173 by default) -- correct for a normal Vite app, wrong here. This
# site has no such thing: `npm run build` above is a one-shot build that
# writes solar-system/landing-dist/ and exits; solar-system/src/** is
# unbundled ES modules with nothing to watch. Auto-detection ran that build
# command, watched it exit immediately (correctly -- it's not supposed to
# keep running), never saw port 5173 open, and gave up: "Waiting for Vite
# dev server to be ready on port 5173 ... Shutting down Netlify Dev server."
#
# framework = "#static" tells Netlify Dev to skip framework detection
# entirely and serve `publish` directly, the same static-file model already
# used in production (build once, then serve the output) -- not a live
# framework dev server to proxy.
[dev]
  framework = "#static"
  publish = "solar-system"
  functions = "netlify/functions"

# ---------- security headers ----------
# The Content-Security-Policy is the important one. It is defence in depth for
# HTML-injection bugs: even if untrusted text reaches the DOM as markup, the
# browser refuses to execute injected scripts or load anything from an origin
# not listed here. That matters most once accounts exist, because a script
# running on the page could otherwise read the session token out of
# localStorage. See tasks/security.md.
#
# Every allowed origin below is one the app genuinely uses:
#   cdn.jsdelivr.net          three.js, loaded via the import map
#   upload.wikimedia.org      planet/moon/galaxy imagery
#   api.spaceflightnewsapi.net  news ticker
#   api.wheretheiss.at        live ISS position
# Anything else is blocked.
#
# connect-src allows *.supabase.co rather than one specific project URL. That
# is deliberately a little broader than strictly necessary: pinning the exact
# project would be marginally tighter, but it would also mean that creating the
# Supabase project, or ever moving to another one, silently breaks every login
# until someone remembers to edit this line — a failure that shows up as "the
# app won't let anyone in" at the worst possible moment. The wildcard still
# refuses every origin that isn't a Supabase project, which is the property
# that matters. wss: is listed alongside https: because the client opens a
# websocket for auth token refresh.
#
# The 'sha256-...' entry whitelists the one inline script in index.html — the
# import map, which cannot be moved to an external file because import maps
# must be inline. It is pinned by hash rather than allowing 'unsafe-inline',
# which would defeat most of the point by also permitting injected inline
# handlers like onerror=. IF THE IMPORT MAP IS EVER EDITED, recompute with:
#   python3 -c "import hashlib,base64,re;raw=open('solar-system/index.html',encoding='utf-8').read();print('sha256-'+base64.b64encode(hashlib.sha256(re.search(r'<script type=\"importmap\">(.*?)</script>',raw,re.S).group(1).encode()).digest()).decode())"
#
# style-src keeps 'unsafe-inline' because the React landing page sets inline
# styles. That is a far smaller risk than allowing inline script: it permits
# restyling, not code execution.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-B6+XRHRnr3Y6WHM8ngBHPYCV5goO+5uFR5suc2afygo=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://api.spaceflightnewsapi.net https://api.wheretheiss.at https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # Stops the site being framed by another page, which is how clickjacking
    # works. frame-ancestors above covers modern browsers; this covers old ones.
    X-Frame-Options = "DENY"

    # Stops the browser second-guessing a declared Content-Type, which is how
    # an uploaded or proxied file can end up executed as script.
    X-Content-Type-Options = "nosniff"

    # Send the full URL only to ourselves; only the bare origin off-site.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Deny hardware the app never uses, and explicitly keep the two it does:
    # the microphone (voice commands) and spatial tracking (WebXR). Leaving
    # those out would silently break voice control and VR.
    Permissions-Policy = "geolocation=(), camera=(), payment=(), usb=(), magnetometer=(), microphone=(self), xr-spatial-tracking=(self)"

    # Force HTTPS for a year. Netlify already serves HTTPS; this stops a
    # downgrade attempt on a hostile network from ever being attempted.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
